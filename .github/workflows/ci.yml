name: checks
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[api,ui,dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python scripts/gen_security_catalog.py --check
      - run: python -m llm_lab security-eval --cases data/security/benign.jsonl data/security/rag-injection.jsonl --check
      - run: python -m pytest -q
        env:
          GRADIO_ANALYTICS_ENABLED: 'False'
