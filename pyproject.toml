[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-hands-on"
version = "0.2.0"
description = "从 HTTP 到 RAG 和 Agent 的可运行中文学习实验室"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = ["gradio>=6,<7"]
api = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
llm-lab = "llm_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["01-infra"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
